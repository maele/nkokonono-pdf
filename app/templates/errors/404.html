{% extends "base.html" %}
{% block title %}Not found — {{ app_name }}{% endblock %}
{% block content %}
<section class="py-20">
  <div class="mx-auto max-w-xl px-4 text-center sm:px-6">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Page not found</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-400">{{ message or "The page you requested does not exist." }}</p>
    <a href="{{ url_for('main.index') }}" class="mt-8 inline-flex items-center justify-center rounded-lg bg-teal-600 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-teal-700">Back to home</a>
  </div>
</section>
{% endblock %}
